[package]
name = "udiskrs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-io = "2.6.0"
clap = { version = "4.6.6", default-features = false, features = ["derive", "std"]}
futures-lite = "2.6.1"
notify-rust = { version = "4.18.0", default-features = false, features = ["zbus", "serde"] }
zbus = "5.18.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
